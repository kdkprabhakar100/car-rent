<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Car Rent</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <img src="assets/images/Logo.svg" alt="logo" class="navbar__logo" />

        <form class="navbar__search-bar">
          <img
            src="assets/icons/search-normal.svg"
            alt="search icon"
            class="search-bar__icon"
          />
          <input
            type="text"
            placeholder="Search something here"
            class="search-bar__input"
            id="search-bar__text"
          />
          <img
            src="assets/icons/filter.svg"
            alt="filter"
            class="search-bar__filter-icon"
          />
        </form>

        <div class="navbar__icons">
          <div class="icons__hidden" id="hiddenIcons">
            <div class="icons__circle">
              <img src="assets/icons/heart.png" alt="heart" />
            </div>

            <div class="icons__circle icons__notification-container">
              <img src="assets/icons/bell.png" alt="bell" />
            </div>

            <div class="icons__circle">
              <img src="assets/icons/setting.png" alt="settings" />
            </div>
          </div>

          <div class="navbar__user-profile" onclick="toggleIcons()">
            <img
              src="assets/images/Image.png"
              alt="user"
              class="user-profile__img"
            />
          </div>
        </div>
      </nav>
    </header>

    <section class="promo">
      <div class="promo__card">
        <div class="promo__content">
          <h3 class="promo__title">
            Ease of doing a car rental safely and reliably. Of course at a low
            price.
          </h3>
          <button class="promo__button promo__button--blue">Rental Car</button>
        </div>
        <img
          src="/assets/images/image 7.png"
          alt="firstcar"
          class="promo__image"
        />
      </div>

      <div class="promo__card">
        <div class="promo__content">
          <h3 class="promo__title">
            Providing cheap car rental services and safe and comfortable
            facilities.
          </h3>
          <button class="promo__button promo__button--green">Rental Car</button>
        </div>
        <img
          src="/assets/images/image 8.png"
          alt="secondcar"
          class="promo__image"
        />
      </div>
    </section>
    <div class="pickndrop-container">
      <!-- Pick-Up Box -->
      <div class="pickup-box">
        <h3 class="section-title">Pick-Up</h3>
        <div class="content-box">
          <div class="field">
            <label data-short="Location"><span>Locations</span></label>
            <select>
              <option value="" disabled selected hidden>
                Select your city
              </option>
            </select>
          </div>
          <div class="field">
            <label data-short="Date"><span>Date</span></label>
            <select>
              <option value="" disabled selected hidden>
                Select your date
              </option>
            </select>
          </div>
          <div class="field">
            <label data-short="Time"><span>Time</span></label>
            <select>
              <option value="" disabled selected hidden>
                Select your time
              </option>
            </select>
          </div>
        </div>
      </div>

      <div class="swap-btn">
        <img src="assets/icons/Switch.png" alt="Swap" width="60" height="60" />
      </div>

      <!-- Drop-Off Box  -->
      <div class="dropoff-box">
        <h3 class="section-title">Drop-Off</h3>
        <div class="content-box">
          <div class="field">
            <label data-short="Location"><span>Locations</span></label>
            <select>
              <option value="" disabled selected hidden>
                Select your city
              </option>
            </select>
          </div>
          <div class="field">
            <label data-short="Date"><span>Date</span></label>
            <select>
              <option value="" disabled selected hidden>
                Select your date
              </option>
            </select>
          </div>
          <div class="field">
            <label data-short="Time"><span>Time</span></label>
            <select>
              <option value="" disabled selected hidden>
                Select your time
              </option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/script.js"></script>
    <script src="/js/select.js"></script>
  </body>
</html>
